<!-- CLIENT INTERACTIONS FOR RPG ACTIONS -->
<script>
    function castSkill(buttonEl, isCorrect, feedbackMsg) {
      const toast = document.getElementById('battle-toast');
      const toastText = document.getElementById('toast-text');
      const toastIcon = document.getElementById('toast-icon');
      toast.classList.remove('hidden');

      if (isCorrect) {
        toastIcon.innerText = 'check_circle';
        toastIcon.className = 'material-symbols-outlined text-[#1CA843] text-[26px]';
        toastText.innerText = feedbackMsg;
        buttonEl.classList.add('!bg-[#DCFADC]', '!border-[#1CA843]');
      } else {
        toastIcon.innerText = 'dangerous';
        toastIcon.className = 'material-symbols-outlined text-[#DE3C2F] text-[26px]';
        toastText.innerText = feedbackMsg;
        buttonEl.classList.add('!bg-[#FCE1DE]', '!border-[#DE3C2F]');
      }
    }

    function showHintMessage() {
      const toast = document.getElementById('battle-toast');
      const toastText = document.getElementById('toast-text');
      const toastIcon = document.getElementById('toast-icon');
      toast.classList.remove('hidden');
      toastIcon.innerText = 'lightbulb';
      toastIcon.className = 'material-symbols-outlined text-[#E59700] text-[26px]';
      toastText.innerText = '💡 Petunjuk: Klorofil a berfungsi menyerap spektrum gelombang cahaya biru & merah pada pusat reaksi Fotosistem II.';
    }

    function useElixir() {
      const toast = document.getElementById('battle-toast');
      const toastText = document.getElementById('toast-text');
      const toastIcon = document.getElementById('toast-icon');
      toast.classList.remove('hidden');
      toastIcon.innerText = 'healing';
      toastIcon.className = 'material-symbols-outlined text-[#16A34A] text-[26px]';
      toastText.innerText = '🧪 Elixir diminum! HP Mage pulih penuh (+200 HP) dan bonus pertahanan aktif!';
    }
</script>
